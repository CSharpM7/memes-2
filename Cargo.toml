[package]
name = "smashline2_memes"
version = "0.1.0"
authors = []
edition = "2021"

[package.metadata.skyline]
titleid = "01006A800016E000" # Smash Ultimate

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git" }
skyline_smash = { git = "https://github.com/ultimate-research/skyline-smash.git" }

smash_script = { git = "https://github.com/WuBoytH/smash-script.git", branch = "development" }
smashline = { git = "https://github.com/HDR-Development/smashline" }
smash_singletons = { git = "https://github.com/WuBoytH/smash_singletons.git" }
smash_rs = { git = "https://github.com/WuBoytH/smash-rs", package = "smash" }

sharpsmashlinesuite = { path = "../../SharpSmashlineSuite"}

param_config = { path = "../../paramconfig"}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[features]
dev = []
devhook = []